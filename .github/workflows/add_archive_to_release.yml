name: Publish archive

# yamllint disable-line rule:truthy
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: Tag of the release the archive is attached to
        required: true
        type: string

permissions: {}

jobs:
  build:
    name: Publish archive
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Set the package name
        working-directory: ./custom_components
        run: |
          package=$(find . -mindepth 1 -maxdepth 1 -type d \
            -not -name '__pycache__' -printf '%f\n' | sort | head -1)
          echo "package=${package}" >> "$GITHUB_ENV"

      - name: Set the variables
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          {
            echo "archive=${package}.zip"
            echo "tag=${TAG}"
          } >> "$GITHUB_ENV"

      - name: Adjust the version number
        run: |
          version="${tag,,}"
          manifest="custom_components/${package}/manifest.json"
          jq --arg version "${version#v}" '.version = $version' \
            "${manifest}" > "${manifest}.new"
          mv "${manifest}.new" "${manifest}"

      - name: Zip the component directory
        working-directory: ./custom_components/${{ env.package }}
        run: zip "${archive}" -r ./

      - name: Attach the archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${tag}" \
            "./custom_components/${package}/${archive}" --clobber
