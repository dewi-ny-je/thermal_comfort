name: Release

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump, or auto to read the commit messages
        required: false
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      initial_version:
        description: Version to release when there is no release tag yet
        required: false
        default: ""
        type: string
      dry_run:
        description: Work out the next version without publishing a release
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history and every tag, the next version is worked out
          # from the commits since the most recent release tag.
          fetch-depth: 0
          fetch-tags: true

      - name: Work out the next version
        id: version
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
          INITIAL_VERSION: ${{ inputs.initial_version }}
        run: |
          python3 .github/scripts/next_version.py \
            --bump "${BUMP}" \
            --initial-version "${INITIAL_VERSION}" \
            --notes-file release-notes.md

      - name: Summarise
        if: steps.version.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          BUMP: ${{ steps.version.outputs.bump }}
          COMMITS: ${{ steps.version.outputs.commits }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          {
            echo "## ${TAG} (${BUMP})"
            echo
            echo "${COMMITS} commits since ${PREVIOUS_TAG:-the start of the history}."
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create the release
        if: steps.version.outputs.release == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file release-notes.md

  archive:
    name: Attach archive
    needs: release
    if: needs.release.outputs.release == 'true' && inputs.dry_run != true
    permissions:
      contents: write
    uses: ./.github/workflows/add_archive_to_release.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
